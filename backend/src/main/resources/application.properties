spring.application.name=Resourcivo

#DBMS Services
spring.datasource.url=jdbc:mysql://localhost:3306/resourcivo_dev
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Table Property
spring.jpa.hibernate.ddl-auto=update

#Query visibility set to true
spring.jpa.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

#server config
server.port=2020
server.servlet.context-path=/resourcivo

#security config

# Only health/info are exposed; the rest of /actuator needs the ADMIN role
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Profile pictures (the service enforces a 2 MB limit; allow a little headroom for the multipart envelope)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Secrets live outside this file: environment variables, or application-local.properties (git-ignored)
spring.config.import=optional:file:./application-local.properties

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=1800000

# Email Configuration (Gmail example - update with your SMTP server)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Base URL (for email links)
app.base-url=http://localhost:3000

# Logging Configuration
logging.level.root=INFO
logging.level.com.project.resourcivo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
# Verbose SQL/security logging: run with --spring.profiles.active=dev (see application-dev.properties)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ResourcivoHikariPool

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=faculty,students,courses,subjects